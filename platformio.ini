[platformio]
src_dir = examples/basic/src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Add PixelFlow headers (repo-root/src) to include path
build_flags =
  -I${PROJECT_DIR}/src

; Also compile PixelFlow sources (repo-root/src/*.cpp)
build_src_filter =
  +<*>
  +<${PROJECT_DIR}/src/*.cpp>

lib_deps =
  bblanchon/ArduinoJson@^7
  adafruit/Adafruit NeoPixel@^1.12.0
  